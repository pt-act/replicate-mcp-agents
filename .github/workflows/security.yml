name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write   # for uploading SARIF results

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # pip-audit — known CVE check against our declared dev/CI environment
  # (the lockfile). We control this: the lock pins patched versions, so a
  # failure here means OUR environment is vulnerable — blocking. Contrast
  # wheel-audit below for the consumer-side (non-blocking) counterpart.
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (lockfile / dev+CI env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry + pip-audit
        run: pip install poetry pip-audit poetry-plugin-export
      - name: Export requirements
        # Audit only declared project deps (not the local editable package itself,
        # not runner-global tools like uv/wheel which aren't our deps).
        run: |
          poetry export --without-hashes -f requirements.txt \
            --without docs \
            -o /tmp/audit-requirements.txt
      - name: Run pip-audit
        run: pip-audit -r /tmp/audit-requirements.txt --desc

  # ---------------------------------------------------------------------------
  # wheel-audit — consumer-side CVE scan (glass box, NON-BLOCKING)
  # ---------------------------------------------------------------------------
  # Counterpart to the lockfile-based pip-audit job above. That job guarantees
  # our declared dev/CI environment is clean (we control the lock). This job does
  # NOT use the lockfile: it builds the published wheel and resolves its deps
  # the way a plain `pip install replicate-mcp-agents` consumer would (latest
  # from PyPI), then audits that closure.
  #
  # We do NOT enforce transitive security for consumers — those packages are
  # not our direct deps (see the `secure` extra for opt-in enforcement). So
  # this job is non-blocking: it surfaces the truth about what consumers get
  # rather than guaranteeing it. A finding here is a decision point (add to
  # `secure`, wait for upstream, or document) — not a release blocker.
  wheel-audit:
    name: pip-audit (published-wheel consumer install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry + pip-audit
        run: pip install poetry pip-audit poetry-plugin-export
      - name: Build wheel
        run: poetry build -f wheel
      - name: Install wheel into clean consumer venv
        run: |
          python -m venv /tmp/consumer
          /tmp/consumer/bin/pip install --upgrade pip
          /tmp/consumer/bin/pip install ./dist/*.whl
          /tmp/consumer/bin/pip install pip-audit
      - name: Print resolved transitive versions (transparency)
        run: |
          /tmp/consumer/bin/pip list --format=freeze \
            | grep -iE '^(click|cryptography|idna|pyjwt|python-multipart|starlette|pygments|python-dotenv)==' \
            || true
      - name: pip-audit consumer install
        continue-on-error: true
        run: /tmp/consumer/bin/pip-audit --desc

  # ---------------------------------------------------------------------------
  # SAST — Bandit static analysis for Python security issues
  # ---------------------------------------------------------------------------
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit[sarif]
      - name: Run Bandit
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            --exclude src/replicate_mcp/dsl.py \
            -f sarif \
            -o bandit-results.sarif || true
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3.28.0
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # ---------------------------------------------------------------------------
  # Semgrep — additional SAST rules
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true   # non-blocking until baseline established

  # ---------------------------------------------------------------------------
  # Secret scanning — detect-secrets pre-flight check
  # ---------------------------------------------------------------------------
  detect-secrets:
    name: detect-secrets (credential scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0    # full history for baseline comparison
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Scan for secrets
        run: |
          detect-secrets scan \
            --exclude-files '\.git/.*' \
            --exclude-files 'poetry\.lock' \
            > .secrets.baseline || true
          detect-secrets audit .secrets.baseline --report || true
          # Fail if any HIGH-confidence secrets found
          python -c "
          import json, sys
          with open('.secrets.baseline') as f:
              data = json.load(f)
          results = data.get('results', {})
          high_confidence = [
              f'{path}:{s[\"line_number\"]}: {s[\"type\"]}'
              for path, secrets in results.items()
              for s in secrets
              if s.get('is_verified') or s.get('type') not in ('Hex High Entropy String', 'Base64 High Entropy String')
          ]
          if high_confidence:
              print('Potential secrets found:')
              print('\n'.join(high_confidence))
              sys.exit(1)
          print('No high-confidence secrets found.')
          "

  # ---------------------------------------------------------------------------
  # SBOM — generate CycloneDX software bill of materials
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry + cyclonedx-py
        run: pip install poetry cyclonedx-bom poetry-plugin-export
      - name: Generate SBOM (CycloneDX JSON)
        run: |
          poetry export --without-hashes --without docs \
            -f requirements.txt -o /tmp/requirements.txt
          cyclonedx-py requirements /tmp/requirements.txt \
            --of JSON \
            -o sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Dependency update check — Renovate / Dependabot handles PRs;
  # this job just verifies the lock file is current.
  # ---------------------------------------------------------------------------
  lockfile-check:
    name: Lock file freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1.3.4
      - name: Verify lock file is up to date
        run: poetry check --lock