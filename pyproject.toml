[project]
name = "replicate-mcp-agents"
version = "0.6.0"
description = "MCP-native agent orchestration for Replicate models"
authors = [
    {name = "pt-act", email = "racore88.ai@gmail.com"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "replicate (>=2.0.0b1,<3.0.0)",
    "mcp (>=1.28.1,<2.0.0)",
    "click (>=8.3.3,<9.0.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "anyio (>=4.14.2,<5.0.0)",
    "httpx (>=0.27.0,<0.28.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "rich (>=13.9.0,<14.0.0)",
    "structlog (>=24.0.0,<26.0.0)",
]

[project.optional-dependencies]
# OpenTelemetry — install with: pip install "replicate-mcp-agents[otel]"
otel = [
    "opentelemetry-sdk>=1.26.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26.0,<2.0.0",
]
# Load testing
load = [
    "locust>=2.31.0,<3.0.0",
]
# HTTP transport — install with: pip install "replicate-mcp-agents[http]"
# Enables: serve_http(), serve_streamable_http(), serve_worker(), workers start
# starlette is a DIRECT dependency of this feature (imported in worker_server),
# not merely transitive via mcp/sse-starlette — declaring it here fixes a latent
# reliance on a transitive and enforces the security floor.
http = [
    "uvicorn>=0.29.0,<1.0.0",
    "starlette>=1.3.1",
]
# Latitude integration — install with: pip install "replicate-mcp-agents[latitude]"
# Enables: Prompt management, tracing, evaluations via latitude.sh
latitude = [
    "httpx>=0.27.0,<0.28.0",
]
# Security hardening — install with: pip install "replicate-mcp-agents[secure]"
# Opt-in enforced floors for known-vulnerable TRANSITIVE deps (via mcp / httpx /
# anyio / rich) that this project does NOT import directly. Declaring them as core
# deps would misrepresent the dependency graph; instead we disclose the posture
# and let consumers choose: [secure] for enforced floors, or your own `pip-audit`
# / lockfile policy. (Side effect: Poetry resolves all extras at lock time, so
# these floors also keep poetry.lock — and the lockfile-based CI pip-audit job —
# clean. See the wheel-audit job in .github/workflows/security.yml for the
# consumer-side counterpart.)
secure = [
    "python-multipart>=0.0.31",  # via mcp: PYSEC-2026-3036/3037/3039/3040
    "pyjwt>=2.13.0",             # via mcp[crypto]: PYSEC-2026-175/176/177/178/179
    "cryptography>=50.0.0",      # via pyjwt[crypto]: GHSA-537c-gmf6-5ccf
    "idna>=3.15",                # via httpx/anyio: PYSEC-2026-215
    "pygments>=2.20.0",          # via rich/pytest: CVE-2026-4539
    "python-dotenv>=1.2.2",      # via mcp: CVE-2026-28684
]
# Full dev extras — inlined to avoid self-referencing extras (Poetry compat)
all = [
    "opentelemetry-sdk>=1.26.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26.0,<2.0.0",
    "locust>=2.31.0,<3.0.0",
    "uvicorn>=0.29.0,<1.0.0",
    "httpx>=0.27.0,<0.28.0",
]

[project.scripts]
"replicate-agent" = "replicate_mcp.cli.main:app"
"replicate-mcp-server" = "replicate_mcp.server:serve"

# Plugin entry-point group: third-party plugins register here.
# Example in a plugin's pyproject.toml:
#   [project.entry-points."replicate_mcp.plugins"]
#   my_plugin = "my_package.plugin:MyPlugin"
[project.entry-points."replicate_mcp.plugins"]
# (no built-in plugins yet — placeholder so the group is documented)


[tool.poetry]
packages = [{include = "replicate_mcp", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
mypy = "^1.13.0"
ruff = "^0.7.0"
pre-commit = "^4.0.0"

# Note: security floors for transitive deps live in [project.optional-dependencies]
# under the `secure` and `http` extras (see above), not here. That keeps the dev
# group to genuine dev tools and avoids misrepresenting transitives as dev deps.
# The extras influence lock resolution, so poetry.lock stays patched.

# mcp is now a core dependency; no longer needed in a separate group

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
mkdocstrings = {version = "^0.26.0", extras = ["python"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "-v"
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ASYNC", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "replicate.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "keyring"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

